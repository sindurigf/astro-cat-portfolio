name: Test weakening

# pull_request_target runs this file and the guard from the default branch, so a
# pull request cannot edit the check that judges it. Its head is fetched as git
# objects only: nothing from it is installed, imported or run.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  guard:
    # The `main` ruleset requires this name (docs/DEPLOYMENT.md#repository-settings).
    name: Test weakening
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch the pull request's commits as data
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags origin "+refs/pull/$PR_NUMBER/head:refs/remotes/origin/pull-head"
          if [ "$(git rev-parse refs/remotes/origin/pull-head)" != "$HEAD_SHA" ]; then
            echo "::error::The pull request moved past $HEAD_SHA; the run for its newer head checks it."
            exit 1
          fi
          git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null || git fetch --no-tags origin "$BASE_SHA"

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'

      - name: Compare the pull request with its base
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-test-weakening.mjs
