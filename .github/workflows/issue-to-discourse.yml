name: Create Discourse topic for new issues

# Opt-in: a fork without the DISCOURSE_* variables skips the job
# (docs/DEPLOYMENT.md#repository-settings).
on:
  issues:
    types: [opened]

permissions:
  issues: write

concurrency:
  # One FIFO queue per issue or pull request across the forum workflows: the
  # topic exists before a comment, close or reopen for it runs. queue: max keeps
  # every pending run; the default cancels all but the newest.
  group: discourse-${{ github.event.issue.number || github.event.pull_request.number }}
  queue: max

jobs:
  create-topic:
    name: Create Discourse topic
    if: vars.DISCOURSE_URL != '' && vars.DISCOURSE_CATEGORY_ID != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Create topic in Discourse
        id: discourse
        env:
          DISCOURSE_URL: ${{ vars.DISCOURSE_URL }}
          DISCOURSE_CATEGORY_ID: ${{ vars.DISCOURSE_CATEGORY_ID }}
          DISCOURSE_API_KEY: ${{ secrets.DISCOURSE_API_KEY }}
          DISCOURSE_API_USERNAME: ${{ secrets.DISCOURSE_API_USERNAME }}
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
        run: |
          set -euo pipefail
          if [ -z "$DISCOURSE_API_KEY" ] || [ -z "$DISCOURSE_API_USERNAME" ]; then
            echo "::error::Set the DISCOURSE_API_KEY and DISCOURSE_API_USERNAME secrets."
            exit 1
          fi
          linked=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("Discussion for this issue is open on the forum: "))) | .id')
          if [ -n "$linked" ]; then
            echo "#${ISSUE_NUMBER} already has a forum topic."
            exit 0
          fi
          base="${DISCOURSE_URL%/}"
          # Must match topicExternalId in scripts/discourse-sync.mjs.
          external_id="github-issue-${ISSUE_NUMBER}"
          # Not followed: curl -L would send Api-Key to any host the redirect names.
          lookup=$(curl -sS --max-time 30 -o /dev/null -w '%{http_code} %{redirect_url}' \
            "${base}/t/external_id/${external_id}.json" \
            -H "Api-Key: ${DISCOURSE_API_KEY}" \
            -H "Api-Username: ${DISCOURSE_API_USERNAME}")
          status="${lookup%% *}"
          location="${lookup#* }"
          if [ "$status" = "301" ] && [[ "$location" == "${base}/t/"*.json ]]; then
            echo "topic_url=${location%.json}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$status" != "404" ]; then
            echo "::error::Discourse answered ${lookup} for topic ${external_id}."
            exit 1
          fi
          payload=$(jq -n \
            --arg title "GitHub issue #${ISSUE_NUMBER}: ${ISSUE_TITLE}" \
            --arg body "${ISSUE_BODY:-}" \
            --arg url "$ISSUE_URL" \
            --arg author "$ISSUE_AUTHOR" \
            --arg external_id "$external_id" \
            --argjson category "$DISCOURSE_CATEGORY_ID" \
            '{ title: ($title | if length > 255 then .[0:254] + "…" else . end), category: $category, external_id: $external_id, raw: ("Opened by " + $author + " on GitHub:\n\n" + $url + "\n\n---\n\n" + (if $body == "" then "_No description provided._" else ($body | gsub("(?<a>^|[^\\w`/])@(?<b>[\\w-])"; "\(.a)@\u200b\(.b)")) end)) }')
          if ! response=$(curl -sS --max-time 30 --fail-with-body -X POST "${base}/posts.json" \
            -H "Content-Type: application/json" \
            -H "Api-Key: ${DISCOURSE_API_KEY}" \
            -H "Api-Username: ${DISCOURSE_API_USERNAME}" \
            -d "$payload"); then
            echo "::error::Discourse refused the topic: ${response}"
            exit 1
          fi
          topic_id=$(printf '%s' "$response" | jq -r '.topic_id // empty')
          topic_slug=$(printf '%s' "$response" | jq -r '.topic_slug // empty')
          if [ -z "$topic_id" ] || [ -z "$topic_slug" ]; then
            echo "::error::Discourse answered without a topic_id or topic_slug: ${response}"
            exit 1
          fi
          echo "topic_url=${base}/t/${topic_slug}/${topic_id}" >> "$GITHUB_OUTPUT"

      # scripts/discourse-sync.mjs finds the topic by this text (LINK_COMMENT_PREFIX).
      - name: Comment on the issue with the topic link
        if: steps.discourse.outputs.topic_url != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TOPIC_URL: ${{ steps.discourse.outputs.topic_url }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body "Discussion for this issue is open on the forum: ${TOPIC_URL}"
