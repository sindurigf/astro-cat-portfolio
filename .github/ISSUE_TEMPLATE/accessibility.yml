name: Accessibility Barrier
description: Something on the site blocks you or makes it hard to use.
title: 'Barrier: '
labels: ['accessibility']
body:
  - type: markdown
    attributes:
      value: "Tell me what got in your way. Every field is optional, and you don't need to know any accessibility terms. To report privately, email hello@example.com."
  - type: input
    id: page
    attributes:
      label: Page Address
      description: For example https://example.com/about/
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What went wrong, and what you expected instead.
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: 'For example: press Tab three times, then Enter.'
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Blocker
        - Major
        - Minor
    validations:
      required: false
  - type: input
    id: browser
    attributes:
      label: Browser and Device
      description: For example Firefox 131 on Windows 11.
  - type: input
    id: assistive
    attributes:
      label: Assistive Technology
      description: For example NVDA, VoiceOver, 200% zoom or keyboard only. Leave empty if none.
  - type: textarea
    id: media
    attributes:
      label: Screenshots or Recordings
      description: Drag files here. Leave out anything private.
